name: Clix patched release

# Builds the latest official G-Helper release with the Matrix Clix (GK6X) patch from clix/ and
# publishes it here under the same tag. The patched G-Helper's updater checks this fork's releases.
# If the patch, the tests or the build fail, the run fails (GitHub sends a failure email) and
# nothing is published, so the patched updater never offers a broken build.

on:
  schedule:
    - cron: '17 10 * * *'   # daily, 02:17 Pacific (standard time)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (empty = latest official release)'
        required: false
      force:
        description: 'Rebuild even if this tag is already released here'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Find upstream release
        id: up
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = gh api repos/seerge/g-helper/releases/latest --jq .tag_name }
          if (-not $tag) { throw "Could not read the latest seerge/g-helper release" }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $build = (-not $exists) -or ("${{ inputs.force }}" -eq "true")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          Write-Output "Upstream $tag; already released here: $exists; building: $build"

      - name: Checkout this fork (patch files)
        if: steps.up.outputs.build == 'True'
        uses: actions/checkout@v7
        with:
          path: fork

      - name: Checkout upstream release
        if: steps.up.outputs.build == 'True'
        uses: actions/checkout@v7
        with:
          repository: seerge/g-helper
          ref: ${{ steps.up.outputs.tag }}
          path: upstream

      - name: Setup dotnet
        if: steps.up.outputs.build == 'True'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Unit and mock-transport tests
        if: steps.up.outputs.build == 'True'
        run: dotnet run -c Release --project fork/clix/tests/Gk6x.Tests.csproj

      - name: Setup Python
        if: steps.up.outputs.build == 'True'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow (icon badge)
        if: steps.up.outputs.build == 'True'
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Apply patch
        if: steps.up.outputs.build == 'True'
        run: python fork/clix/apply_patch.py upstream "${{ github.repository }}"

      - name: Check tag matches version
        if: steps.up.outputs.build == 'True'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content upstream/app/GHelper.csproj)).Project.PropertyGroup.AssemblyVersion
          if ("${{ steps.up.outputs.tag }}" -ne "v$version") { throw "Tag ${{ steps.up.outputs.tag }} does not match AssemblyVersion $version" }

      - name: Build
        if: steps.up.outputs.build == 'True'
        run: dotnet publish upstream/app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

      - name: Package
        if: steps.up.outputs.build == 'True'
        id: pkg
        shell: pwsh
        run: |
          $exe = "upstream/app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item $exe out/GHelper.exe
          Compress-Archive out/GHelper.exe out/GHelper.zip
          $sha = (Get-FileHash out/GHelper.exe -Algorithm SHA256).Hash
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: steps.up.outputs.build == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.up.outputs.tag }}"
          $repo = "${{ github.repository }}"
          # Clix part of the notes: the newest "## Clix build N" section of clix/CHANGELOG.md.
          $log = Get-Content fork/clix/CHANGELOG.md -Raw
          $m = [regex]::Match($log, '(?ms)^## (Clix build \d+)\s*\n(.*?)(?=^## |\z)')
          if (-not $m.Success) { throw "clix/CHANGELOG.md has no '## Clix build N' section" }
          $build = $m.Groups[1].Value
          $clixNotes = $m.Groups[2].Value.Trim()
          $short = "${{ github.sha }}".Substring(0, 7)
          $upstream = gh api "repos/seerge/g-helper/releases/tags/$tag" --jq .body
          if ($LASTEXITCODE -ne 0 -or -not $upstream) { $upstream = "(not available, see the link above)" }
          $global:LASTEXITCODE = 0
          $notes = @"
          G-Helper $tag with the Matrix Clix patch ($build, $short).

          ## What's new in $build
          $clixNotes

          Full Clix history: https://github.com/$repo/blob/${{ github.sha }}/clix/CHANGELOG.md

          ## Build
          - Upstream source: seerge/g-helper @ $tag (https://github.com/seerge/g-helper/releases/tag/$tag)
          - Patch source: $repo @ ${{ github.sha }}
          - GHelper.exe SHA-256: ${{ steps.pkg.outputs.sha }}
          - Unsigned build (official releases are signed by seerge; this one is not).

          ## Official G-Helper $tag notes
          $upstream
          "@
          $title = "G-Helper Clix $tag ($build)"
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            $global:LASTEXITCODE = 0
            gh release upload $tag out/GHelper.exe out/GHelper.zip --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "upload failed" }
            gh release edit $tag --repo $repo --title $title --notes-file $notesFile
          } else {
            $global:LASTEXITCODE = 0
            gh release create $tag out/GHelper.exe out/GHelper.zip --repo $repo --target "${{ github.sha }}" --title $title --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
