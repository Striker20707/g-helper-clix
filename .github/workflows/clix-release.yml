name: Clix patched release

# Builds official G-Helper with the Matrix Clix (GK6X) patch from clix/ and publishes it here, so the patched
# G-Helper's own updater picks it up.
#
# When it runs:
#  * daily: a new official G-Helper release is built and published as soon as it appears
#  * on every push to the clix branch: a new "## Clix build N" in clix/CHANGELOG.md is built and published
#    (a push that doesn't raise N is only built and tested)
#  * on pull requests to clix: built and tested only, never published
#  * by hand (Actions tab): optionally a specific upstream tag, or "force" to rebuild what's there
#
# Compatibility: the "upstream-main" job applies and builds the same patch against seerge/g-helper's
# development branch every day, so a change that will break the next official release shows up early.
# If the patch, the tests or the build fail, nothing is published (the installed Clix build keeps working and
# is simply not updated), GitHub emails the failure, and an issue is opened here when issues are enabled.

on:
  schedule:
    - cron: '17 10 * * *'   # daily, 02:17 Pacific (standard time)
  push:
    branches: [clix]
    paths: ['clix/**', '.github/workflows/clix-release.yml']
  pull_request:
    branches: [clix]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (empty = latest official release)'
        required: false
      force:
        description: 'Rebuild even if this tag and Clix build are already released here'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: clix-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout this fork (patch files)
        uses: actions/checkout@v7
        with:
          path: fork

      - name: Decide what to build
        id: up
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = gh api repos/seerge/g-helper/releases/latest --jq .tag_name }
          if (-not $tag) { throw "Could not read the latest seerge/g-helper release" }
          $log = Get-Content fork/clix/CHANGELOG.md -Raw
          $m = [regex]::Match($log, '(?m)^## Clix build (\d+)\s*$')
          if (-not $m.Success) { throw "clix/CHANGELOG.md has no '## Clix build N' heading" }
          $localBuild = [int]$m.Groups[1].Value
          $title = gh release view $tag --repo "${{ github.repository }}" --json name --jq .name 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $publishedBuild = -1
          if ($exists) { $p = [regex]::Match("$title", 'Clix build (\d+)'); if ($p.Success) { $publishedBuild = [int]$p.Groups[1].Value } }
          $event = "${{ github.event_name }}"
          if ($event -eq 'pull_request') { $build = $true; $publish = $false; $why = "pull request: build and test only" }
          elseif (-not $exists) { $build = $true; $publish = $true; $why = "new official version $tag" }
          elseif ("${{ inputs.force }}" -eq "true") { $build = $true; $publish = $true; $why = "forced rebuild" }
          elseif ($localBuild -gt $publishedBuild) { $build = $true; $publish = $true; $why = "Clix build $localBuild is newer than released build $publishedBuild" }
          elseif ($event -eq 'push') { $build = $true; $publish = $false; $why = "push without a new Clix build number: build and test only" }
          else { $build = $false; $publish = $false; $why = "$tag Clix build $publishedBuild is already released" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Output "Upstream $tag, Clix build $localBuild (released: $publishedBuild). Build: $build, publish: $publish ($why)"

      - name: Checkout upstream release
        if: steps.up.outputs.build == 'True'
        uses: actions/checkout@v7
        with:
          repository: seerge/g-helper
          ref: ${{ steps.up.outputs.tag }}
          path: upstream

      - name: Setup dotnet
        if: steps.up.outputs.build == 'True'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Unit and mock-transport tests
        if: steps.up.outputs.build == 'True'
        run: dotnet run -c Release --project fork/clix/tests/Gk6x.Tests.csproj

      - name: Setup Python
        if: steps.up.outputs.build == 'True'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow (icon ring)
        if: steps.up.outputs.build == 'True'
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Apply patch
        if: steps.up.outputs.build == 'True'
        run: python fork/clix/apply_patch.py upstream "${{ github.repository }}"

      - name: Check tag matches version
        if: steps.up.outputs.build == 'True'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content upstream/app/GHelper.csproj)).Project.PropertyGroup.AssemblyVersion
          if ("${{ steps.up.outputs.tag }}" -ne "v$version") { throw "Tag ${{ steps.up.outputs.tag }} does not match AssemblyVersion $version" }

      - name: Build
        if: steps.up.outputs.build == 'True'
        run: dotnet publish upstream/app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

      - name: Package
        if: steps.up.outputs.build == 'True'
        id: pkg
        shell: pwsh
        run: |
          $exe = "upstream/app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item $exe out/GHelper.exe
          Compress-Archive out/GHelper.exe out/GHelper.zip
          $sha = (Get-FileHash out/GHelper.exe -Algorithm SHA256).Hash
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Keep the build (pull requests)
        if: steps.up.outputs.build == 'True' && steps.up.outputs.publish != 'True'
        uses: actions/upload-artifact@v4
        with:
          name: GHelper-clix-untested
          path: out/GHelper.exe
          retention-days: 7

      - name: Publish release
        if: steps.up.outputs.publish == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.up.outputs.tag }}"
          $repo = "${{ github.repository }}"
          # Clix part of the notes: the newest "## Clix build N" section of clix/CHANGELOG.md.
          # The title carries "(Clix build N)": the patched updater compares it to offer rebuilds of one version.
          $log = Get-Content fork/clix/CHANGELOG.md -Raw
          $m = [regex]::Match($log, '(?ms)^## (Clix build \d+)\s*\n(.*?)(?=^## |\z)')
          if (-not $m.Success) { throw "clix/CHANGELOG.md has no '## Clix build N' section" }
          $build = $m.Groups[1].Value
          $clixNotes = $m.Groups[2].Value.Trim()
          $short = "${{ github.sha }}".Substring(0, 7)
          $upstream = gh api "repos/seerge/g-helper/releases/tags/$tag" --jq .body
          if ($LASTEXITCODE -ne 0 -or -not $upstream) { $upstream = "(not available, see the link above)" }
          $global:LASTEXITCODE = 0
          $notes = @"
          G-Helper $tag with the Matrix Clix patch ($build, $short).

          ## What's new in $build
          $clixNotes

          Full Clix history: https://github.com/$repo/blob/${{ github.sha }}/clix/CHANGELOG.md

          ## Build
          - Upstream source: seerge/g-helper @ $tag (https://github.com/seerge/g-helper/releases/tag/$tag)
          - Patch source: $repo @ ${{ github.sha }}
          - GHelper.exe SHA-256: ${{ steps.pkg.outputs.sha }}
          - Unsigned build (official releases are signed by seerge; this one is not).

          ## Official G-Helper $tag notes
          $upstream
          "@
          $title = "G-Helper Clix $tag ($build)"
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            $global:LASTEXITCODE = 0
            gh release upload $tag out/GHelper.exe out/GHelper.zip --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "upload failed" }
            gh release edit $tag --repo $repo --title $title --notes-file $notesFile
          } else {
            $global:LASTEXITCODE = 0
            gh release create $tag out/GHelper.exe out/GHelper.zip --repo $repo --target "${{ github.sha }}" --title $title --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }

      - name: Report a broken build
        if: failure() && github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Clix build failed for G-Helper ${{ steps.up.outputs.tag }}"
          $body = "The Clix patch could not be built for official G-Helper ${{ steps.up.outputs.tag }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`nNothing was published, so the installed G-Helper Clix keeps working; it just isn't updated until the patch is fixed."
          $n = gh issue list --repo "${{ github.repository }}" --state open --search "in:title `"$title`"" --json number --jq '.[0].number'
          if ($n) { gh issue comment $n --repo "${{ github.repository }}" --body $body } else { gh issue create --repo "${{ github.repository }}" --title $title --body $body }

  upstream-main:
    # Early warning: does the patch still apply and build on upstream's development branch?
    if: github.event_name != 'push'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
      - uses: actions/checkout@v7
        with:
          repository: seerge/g-helper
          path: upstream
      - name: Upstream commit
        id: rev
        shell: pwsh
        run: |
          $sha = git -C upstream rev-parse --short HEAD
          $version = ([xml](Get-Content upstream/app/GHelper.csproj)).Project.PropertyGroup.AssemblyVersion
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Output "seerge/g-helper development branch @ $sha (version $version)"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Apply patch
        run: python fork/clix/apply_patch.py upstream "${{ github.repository }}"
      - name: Build
        run: dotnet publish upstream/app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained
      - name: Report upcoming incompatibility
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Clix patch breaks on upstream G-Helper's development branch"
          $body = "Upstream seerge/g-helper @ ${{ steps.rev.outputs.sha }} no longer takes the Clix patch: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`nThe current release is fine. The next official G-Helper release will fail to build until clix/apply_patch.py or clix/src is updated."
          $n = gh issue list --repo "${{ github.repository }}" --state open --search "in:title `"$title`"" --json number --jq '.[0].number'
          if ($n) { gh issue comment $n --repo "${{ github.repository }}" --body $body } else { gh issue create --repo "${{ github.repository }}" --title $title --body $body }
